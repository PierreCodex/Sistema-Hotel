# Ejecutar análisis completo
.\run-tests.ps1

# Las tablas se generan en:
# tests/reports/detailed-coverage-tables.md# Configuración de Métricas de Calidad - Sistema Hotel
# Este archivo define los objetivos de calidad para el proyecto

[quality_targets]
# Objetivos de Cobertura de Código
coverage_statements_target = 80
coverage_branches_target = 70
coverage_methods_target = 85
coverage_classes_target = 90

# Objetivos de Pruebas
test_success_rate_target = 95
max_test_failures = 2
max_test_duration_seconds = 60

[thresholds]
# Umbrales de Calidad (Excelente/Bueno/Necesita Mejora)
excellent_threshold = 80
good_threshold = 60
needs_improvement_threshold = 40

[reporting]
# Configuración de Reportes
generate_html = true
generate_pdf = false
include_trends = true
notify_on_failure = true

[notifications]
# Configuración de Notificaciones (futuro)
email_enabled = false
slack_enabled = false
teams_enabled = false